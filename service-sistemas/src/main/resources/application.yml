server:
  port: 8083
  forward-headers-strategy: framework
  servlet:
    session:
      tracking-modes: cookie

spring:
  application:
    name: service-sistemas

  datasource:
    url: jdbc:mysql://localhost:10306/onboarding_sistemas?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  rabbitmq:
    host: localhost
    port: 10672
    username: guest
    password: guest

  thymeleaf:
    cache: false

logging:
  level:
    com.poc.onboarding: DEBUG
