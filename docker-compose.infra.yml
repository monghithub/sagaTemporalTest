# Docker Compose - Solo Infraestructura (para desarrollo local)
# Uso: docker compose -f docker-compose.infra.yml up -d
#
# IMPORTANTE: Los contenedores NO se reinician automáticamente al arrancar el sistema.
#             Para iniciarlos manualmente: docker compose -f docker-compose.infra.yml up -d
#             Para pararlos: docker compose -f docker-compose.infra.yml down
#
# PUERTOS:
#   MySQL:          10306
#   RabbitMQ:       10672 (AMQP), 10673 (Management)
#   Temporal:       10233
#   Temporal UI:    10088

services:
  # =============================================================================
  # MySQL - Base de datos principal
  # =============================================================================
  mysql:
    image: mysql:8.0
    container_name: onboarding-mysql
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: onboarding
    ports:
      - "10306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - onboarding-network

  # =============================================================================
  # RabbitMQ - Mensajería
  # =============================================================================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: onboarding-rabbitmq
    restart: "no"
    ports:
      - "10672:5672"
      - "10673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - onboarding-network

  # =============================================================================
  # Temporal Server - Orquestador de Workflows
  # =============================================================================
  temporal:
    image: temporalio/auto-setup:1.22.4
    container_name: onboarding-temporal
    restart: "no"
    ports:
      - "10233:7233"
    environment:
      - DB=mysql8
      - MYSQL_SEEDS=mysql
      - MYSQL_USER=root
      - MYSQL_PWD=root
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - onboarding-network

  # =============================================================================
  # Temporal UI - Interfaz web para Temporal
  # =============================================================================
  temporal-ui:
    image: temporalio/ui:2.22.3
    container_name: onboarding-temporal-ui
    restart: "no"
    ports:
      - "10088:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:18080
    depends_on:
      - temporal
    networks:
      - onboarding-network

volumes:
  mysql_data:
  rabbitmq_data:

networks:
  onboarding-network:
    driver: bridge
