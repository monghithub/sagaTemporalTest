server:
  port: 8081

spring:
  application:
    name: service-ldap

  datasource:
    url: jdbc:mysql://localhost:3307/onboarding_ldap?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  rabbitmq:
    host: localhost
    port: 5673
    username: guest
    password: guest

  thymeleaf:
    cache: false

logging:
  level:
    com.poc.onboarding: DEBUG
